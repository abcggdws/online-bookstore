version: '3.8'

services:
  sqlite:
    image: alpine:latest
    volumes:
      - ./data:/data
    command: ["touch", "/data/bookstore.db"]

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_PATH=/data/bookstore.db
    depends_on:
      - sqlite
    volumes:
      - ./data:/data